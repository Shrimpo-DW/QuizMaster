<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuizMaster</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#14213d;--mu:#5b6680;--bd:#d9e0ee;--ac:#2b4fd6;--hl:#ffd23f;--ok:#1f9d63;--bad:#d64045;--g5:#2a9d8f;--g7:#3a6ea5;--g9:#8e4585;--grid:rgba(43,79,214,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--card:#16213a;--tx:#eaf0ff;--mu:#9aa8c7;--bd:#2a3858;--ac:#7c9cff;--grid:rgba(124,156,255,.07);--g5:#4fc3b4;--g7:#6aa3e0;--g9:#c47bbb;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1526;--card:#16213a;--tx:#eaf0ff;--mu:#9aa8c7;--bd:#2a3858;--ac:#7c9cff;--grid:rgba(124,156,255,.07);--g5:#4fc3b4;--g7:#6aa3e0;--g9:#c47bbb;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 'DM Sans',system-ui,sans-serif;color:var(--tx);background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 28px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0;line-height:1.15}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font:800 22px 'Bricolage Grotesque',sans-serif;cursor:pointer;margin-right:auto;background:linear-gradient(transparent 62%,var(--hl) 62%)}
.pill{border:1px solid var(--bd);border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px;background:var(--bg)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.ib{border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:5px 10px}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
nav{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:700;color:var(--mu)}
.tab.on{background:var(--tx);color:var(--bg)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:5px 14px;font-weight:500}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--c);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.card .em{font-size:30px}.mu{color:var(--mu);font-size:14px}
.btn{border:0;background:var(--ac);color:#fff;font-weight:700;padding:10px 18px;border-radius:10px}
.btn.alt{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.q{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;max-width:680px;margin:0 auto}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:10px 0 20px}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.opt{display:flex;gap:12px;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);font-weight:500}
.opt b{width:26px;height:26px;border-radius:8px;background:var(--card);display:grid;place-items:center;flex:none;font-size:13px}
.opt:not(:disabled):hover{border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--bg))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--bg))}
.opt.gone{opacity:.3;text-decoration:line-through}
.why{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--hl) 30%,var(--card));margin:4px 0 14px;font-size:15px}
.big{font:800 56px 'Bricolage Grotesque',sans-serif}
.tut{white-space:pre-line;font-size:15px;background:var(--bg);border-radius:10px;padding:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;transition:.25s;z-index:20;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.hero{background:linear-gradient(135deg,#2b4fd6,#8e4585);color:#fff;border-radius:22px;padding:32px 26px;position:relative;overflow:hidden}.hero h1{font-size:clamp(30px,6vw,48px)}.hero p{max-width:520px;margin:10px 0 0;opacity:.92}.hero::after{content:"?";position:absolute;right:20px;top:-40px;font:800 200px 'Bricolage Grotesque',sans-serif;opacity:.15}
.card{transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,33,61,.14)}
.card .em{width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--c) 18%,var(--card));font-size:28px}
select.ib{max-width:120px}
.logo{background:none;display:flex;align-items:center;gap:9px;font-size:23px;letter-spacing:-.5px}.logo span{background:linear-gradient(transparent 68%,var(--hl) 68%)}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);padding:24px;width:min(380px,92vw)}dialog::backdrop{background:rgba(10,16,32,.6)}
dialog label{display:block;font-weight:700;font-size:14px;margin:12px 0}dialog input{display:block;width:100%;margin-top:5px;padding:10px 12px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}dialog input:focus{outline:none;border-color:var(--ac)}
.lnk{border:0;background:none;color:var(--ac);font-weight:700;padding:0}
:root{--b1:rgba(43,79,214,.24);--b2:rgba(142,69,133,.2);--b3:rgba(42,157,143,.2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:rgba(99,132,255,.3);--b2:rgba(190,100,180,.22);--b3:rgba(60,190,170,.16)}}
:root[data-theme="dark"]{--b1:rgba(99,132,255,.3);--b2:rgba(190,100,180,.22);--b3:rgba(60,190,170,.16)}
body{background:radial-gradient(900px 520px at 8% -8%,var(--b1),transparent 62%),radial-gradient(800px 520px at 100% 6%,var(--b2),transparent 62%),radial-gradient(800px 520px at 50% 108%,var(--b3),transparent 62%),var(--bg);background-attachment:fixed}
header{background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(14px)}
.card,.q{background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(10px)}
.pill,.btn,#nm{display:inline-flex;align-items:center;gap:6px}[data-i]{display:inline-flex}.card .em{color:var(--c)}
h2{font-size:clamp(24px,4vw,32px)}footer{text-align:center;padding:10px 16px 40px;font-size:13px}
.hero{box-shadow:0 18px 40px -18px rgba(43,79,214,.55)}.hero .btn{background:#fff;color:#2b4fd6}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.st{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:8px 16px;backdrop-filter:blur(6px)}.st b{display:block;font:800 24px 'Bricolage Grotesque',sans-serif}.st small{opacity:.88}
.badge{align-self:flex-start;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.dots{display:flex;gap:4px}.dots i{width:20px;height:6px;border-radius:9px;background:var(--bd)}.dots i.f{background:var(--c)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.ring{width:156px;height:156px;border-radius:50%;margin:6px auto 14px;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--bd) 0);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}.ring div{width:124px;height:124px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:800 40px 'Bricolage Grotesque',sans-serif}
.av{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#2b4fd6,#8e4585);color:#fff;display:grid;place-items:center;font:800 30px 'Bricolage Grotesque',sans-serif;margin:0 auto 10px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.sg div{background:var(--bg);border-radius:12px;padding:10px;text-align:center;font-size:13px}.sg b{display:block;font:800 22px 'Bricolage Grotesque',sans-serif}
.opt{transition:transform .1s,border-color .15s}.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--bg))}.opt:not(:disabled):active{transform:scale(.99)}
</style>
</head>

<script>
const S=[
{id:'m5',g:5,i:'🧮',n:'Math Basics',t:'Fractions: simplify by dividing top and bottom by the same number (12/16 → 3/4).\nDecimals: 0.75 = 75/100 = 3/4.\nPerimeter = add all sides. Area = length × width.\nTip: split big products, 15 × 6 = 10×6 + 5×6.',q:[
["15 × 6 = ?",["80","90","100","75"],1,"15 × 6 = 60 + 30 = 90."],
["What is ½ of 84?",["42","44","40","38"],0,"Halving 84 gives 42."],
["How many sides does a hexagon have?",["5","6","7","8"],1,"Hex- means six."],
["Simplify 12/16.",["3/4","2/3","1/2","4/5"],0,"Divide both numbers by 4."],
["Perimeter of a square with sides of 7 cm?",["28 cm","49 cm","21 cm","14 cm"],0,"4 × 7 = 28. (49 would be the area.)"],
["0.75 as a fraction?",["1/4","3/4","1/2","2/5"],1,"75/100 simplifies to 3/4."]]},
{id:'s5',g:5,i:'🌱',n:'Nature Science',t:'Photosynthesis: sunlight + water + CO₂ → glucose + oxygen, using chlorophyll.\nMatter: solid (fixed shape), liquid (takes the container’s shape), gas (fills the space).\nFood chain: producers → herbivores → predators.\nGravity pulls objects toward Earth’s center.',q:[
["Which planet is the Red Planet?",["Venus","Mars","Jupiter","Saturn"],1,"Iron oxide (rust) on Mars gives it a red color."],
["How do plants make their food?",["Respiration","Photosynthesis","Digestion","Evaporation"],1,"They turn light, water and CO₂ into glucose."],
["Water vapor is which state of matter?",["Solid","Liquid","Gas","Plasma"],2,"Vapor is water in gas form."],
["What pulls objects toward Earth?",["Magnetism","Friction","Gravity","Electricity"],2,"Gravity attracts masses to each other."],
["Main source of energy for Earth?",["The Moon","The Sun","Volcanoes","Wind"],1,"Almost all surface energy comes from sunlight."],
["Which organ pumps blood around the body?",["Lungs","Brain","Heart","Stomach"],2,"The heart is a muscular pump."]]},
{id:'l5',g:5,i:'📖',n:'Language & Grammar',t:'Noun: person, place, thing or idea (happiness).\nVerb: an action (run). Adjective: describes a noun (shiny key).\nAntonym = opposite meaning. Synonym = similar meaning.\nEnd statements with a period, questions with ?, strong feelings with !',q:[
["Which word is a noun?",["Quickly","Run","Happiness","Blue"],2,"Happiness is an idea, so it is a noun."],
["Antonym of “ancient”?",["Old","Modern","Historic","Aged"],1,"Ancient means very old; modern is the opposite."],
["Which sentence is in the past tense?",["I walk home.","I will walk home.","I walked home.","I am walking home."],2,"“Walked” is the past form."],
["Find the adjective: “The shiny key unlocked the door.”",["key","shiny","unlocked","door"],1,"“Shiny” describes the key."],
["What ends an exclamatory sentence?",["Period","Question mark","Exclamation point","Comma"],2,"Exclamations use !"],
["Synonym of “happy”?",["Sad","Joyful","Angry","Tired"],1,"Joyful means almost the same."]]},
{id:'a7',g:7,i:'➗',n:'Algebra I',t:'Sign rules: (−)×(−) = +, (−)×(+) = −.\nSolve equations by undoing operations in reverse order.\n3x − 5 = 10 → 3x = 15 → x = 5.\nCombine like terms: 4a − 2a = 2a.\nPercent: 20% of 150 = 0.20 × 150 = 30.',q:[
["Solve: 2x + 8 = 20",["x = 4","x = 6","x = 8","x = 10"],1,"2x = 12, so x = 6."],
["(−5) × (−4) = ?",["−20","20","−9","9"],1,"Two negatives make a positive."],
["√81 = ?",["7","8","9","10"],2,"9 × 9 = 81."],
["If y = 3x − 2, what is y when x = 5?",["13","15","11","17"],0,"3·5 − 2 = 13."],
["Simplify: 4a + 3b − 2a + b",["2a + 4b","6a + 4b","2a + 2b","4a + 4b"],0,"a-terms: 2a. b-terms: 4b."],
["Solve: x/4 + 3 = 9",["24","12","16","36"],0,"x/4 = 6, so x = 24."]]},
{id:'h7',g:7,i:'🏛️',n:'World History',t:'Feudalism: king → nobles → knights → peasants/serfs, all tied to land.\nBlack Death (1347): plague spread by fleas on rats, killing roughly a third of Europe.\nRome: Julius Caesar led the Republic before it became an Empire.\nEgypt grew along the Nile and built the pyramids.',q:[
["Where was the Roman Empire centered?",["Greece","Italy","France","Spain"],1,"Rome is in Italy."],
["Who wrote the US Declaration of Independence?",["George Washington","Thomas Jefferson","Benjamin Franklin","John Adams"],1,"Jefferson was the main author in 1776."],
["Who built the Pyramids of Giza?",["Romans","Greeks","Egyptians","Mayans"],2,"Ancient Egyptians, about 4,500 years ago."],
["What reached Europe in 1347 and killed millions?",["Black Death","World War I","The Crusades","The Renaissance"],0,"Plague arrived by ship from the Black Sea."],
["Julius Caesar ruled which state?",["Ottoman","Roman","British","Mongol"],1,"He was a Roman general and dictator."],
["Who sat at the bottom of the feudal system?",["Knights","Nobles","Serfs","Kings"],2,"Serfs worked the land for their lord."]]},
{id:'b7',g:7,i:'🧬',n:'Biology & Body',t:'Nucleus holds DNA. Mitochondria release energy. The membrane controls what enters.\nRed blood cells carry oxygen; white blood cells fight infection.\nSystems: circulatory (heart), respiratory (lungs), digestive (stomach, intestines).',q:[
["Which organelle is the cell’s powerhouse?",["Nucleus","Mitochondria","Ribosome","Golgi"],1,"Mitochondria make usable energy (ATP)."],
["What carries oxygen in blood?",["White cells","Red cells","Platelets","Plasma"],1,"Hemoglobin in red cells binds oxygen."],
["Joint type in the shoulder?",["Hinge","Ball and socket","Pivot","Fixed"],1,"It allows rotation in many directions."],
["Which molecule carries hereditary information?",["RNA","DNA","ATP","Glucose"],1,"Genes are made of DNA."],
["Main job of white blood cells?",["Carry oxygen","Fight infection","Clot blood","Digest food"],1,"They are part of the immune system."],
["Which system swaps O₂ and CO₂?",["Digestive","Respiratory","Skeletal","Nervous"],1,"Gas exchange happens in the lungs."]]},
{id:'m9',g:9,i:'📐',n:'Advanced Math',t:'Pythagoras: a² + b² = c² (3-4-5 triangle).\nQuadratic formula: x = [−b ± √(b² − 4ac)] / 2a.\nSOH-CAH-TOA: sin = opp/hyp, cos = adj/hyp, tan = opp/adj.\nLine y = mx + b: m is the slope.\nlog₁₀(1000) = 3 because 10³ = 1000.',q:[
["Hypotenuse of a right triangle with legs 6 and 8?",["9","10","12","14"],1,"36 + 64 = 100, √100 = 10."],
["Solve: x² − 16 = 0",["x = 4","x = ±4","x = 16","x = 8"],1,"Both 4 and −4 square to 16."],
["Derivative of x²?",["x","2x","x³","2"],1,"Power rule: bring down the 2."],
["log₁₀(1000) = ?",["2","3","10","100"],1,"10³ = 1000."],
["sin(90°) = ?",["0","0.5","1","undefined"],2,"At 90° the opposite side equals the hypotenuse."],
["Slope of y = 4x − 7?",["4","−7","7","1/4"],0,"In y = mx + b, m = 4."]]},
{id:'p9',g:9,i:'⚗️',n:'Physics & Chemistry',t:'Newton 1: inertia. Newton 2: F = m × a. Newton 3: every action has an equal, opposite reaction.\nAtoms: protons (+) and neutrons in the nucleus, electrons (−) in shells.\npH 7 is neutral; below is acidic, above is basic.\nLight travels ≈ 300,000 km/s.',q:[
["Newton’s Second Law?",["E = mc²","F = m·a","V = I·R","P = F/A"],1,"Force equals mass times acceleration."],
["Chemical symbol for gold?",["Ag","Au","Fe","Go"],1,"From Latin aurum."],
["Which particles sit in the nucleus?",["Protons & electrons","Protons & neutrons","Neutrons & electrons","Electrons only"],1,"Electrons orbit outside."],
["pH of a neutral solution?",["0","7","14","1"],1,"Pure water is about 7."],
["Speed of light in a vacuum?",["300,000 km/s","150,000 km/s","1,000,000 km/s","30,000 km/s"],0,"About 3 × 10⁸ m/s."],
["SI unit of force?",["Joule","Watt","Newton","Pascal"],2,"1 N = 1 kg·m/s²."]]},
{id:'g9',g:9,i:'🌍',n:'World & Tech',t:'Capitals often surprise: Australia → Canberra, Brazil → Brasília, Canada → Ottawa.\nAir is ~78% nitrogen, ~21% oxygen.\nBinary: 1, 10, 11, 100, 101 = 1, 2, 3, 4, 5.\nCPU = the chip that runs instructions; Python was created by Guido van Rossum.',q:[
["Capital of Australia?",["Sydney","Melbourne","Canberra","Brisbane"],2,"Canberra was built as a compromise capital."],
["Which gas is ~78% of the atmosphere?",["Oxygen","Nitrogen","CO₂","Hydrogen"],1,"Oxygen is only about 21%."],
["Who painted the Mona Lisa?",["Van Gogh","Leonardo da Vinci","Picasso","Michelangelo"],1,"Painted in the early 1500s."],
["Binary for decimal 5?",["100","101","110","111"],1,"4 + 1 = 101."],
["Who created Python?",["Bill Gates","Guido van Rossum","Linus Torvalds","Steve Jobs"],1,"First released in 1991."],
["What does CPU stand for?",["Central Processing Unit","Computer Power Unit","Core Program Utility","Central Printing Unit"],0,"It executes a computer’s instructions."]]},
{id:'geo5',g:5,i:'🗺️',n:'Geography Explorer',t:'Earth has 7 continents and 5 oceans; the Pacific is the largest.\nThe Equator splits the globe into northern and southern hemispheres.\nCapitals: Brazil → Brasília, Egypt → Cairo, Japan → Tokyo.\nA map’s scale shows how real distance shrinks on paper.',q:[
["Largest ocean on Earth?",["Atlantic","Indian","Pacific","Arctic"],2,"The Pacific covers about a third of the planet."],
["How many continents are there?",["5","6","7","8"],2,"Asia, Africa, North America, South America, Antarctica, Europe and Australia."],
["Capital of Brazil?",["Rio de Janeiro","São Paulo","Brasília","Salvador"],2,"Brasília became the capital in 1960."],
["Which line splits north from south?",["Prime Meridian","Equator","Tropic of Cancer","Date Line"],1,"The Equator is 0° latitude."],
["Which continent is Egypt in?",["Asia","Europe","Africa","Australia"],2,"Egypt is in northeast Africa."]]},
{id:'r7',g:7,i:'📏',n:'Geometry & Ratios',t:'Angles in a triangle add up to 180°.\nCircle area = πr². Triangle area = ½ × base × height.\nSupplementary angles add to 180°.\nRatio 3:5 of 40: 40 ÷ 8 = 5, so the parts are 15 and 25.',q:[
["Angles in a triangle add up to?",["90°","180°","270°","360°"],1,"Always 180°."],
["Area of a triangle with base 10 and height 6?",["60","30","16","32"],1,"½ × 10 × 6 = 30."],
["Supplement of a 65° angle?",["25°","115°","125°","295°"],1,"180 − 65 = 115."],
["Split 40 in the ratio 3:5. The smaller part is?",["12","15","20","25"],1,"40 ÷ 8 = 5, and 3 × 5 = 15."],
["Area of a circle?",["2πr","πr²","πd²","r²/2"],1,"Area = π × radius squared."]]},
{id:'c7',g:7,i:'💻',n:'Computers & Coding',t:'A variable stores a value (score = 10).\nA loop repeats steps; an if-statement makes a choice.\nAn algorithm is a step-by-step recipe for solving a problem.\nA bit is 0 or 1; 8 bits make a byte.\nHTML structures web pages, CSS styles them.',q:[

$('#nav').innerHTML=['home','study','shop'].map(v=>`<button class="tab ${V===v?'on':''}" onclick="go('${v}')">${{home:'Quizzes',study:'Study',shop:'Shop'}[v]}</button>`).join('');
$('#nav').style.display=(V==='quiz'||V==='result')?'none':'flex';
const chips=`<div class="chips">${[0,5,7,9].map(g=>`<button class="chip ${G===g?'on':''}" onclick="setG(${g})">${g?g+'th grade':'All grades'}</button>`).join('')}</div>`;
const list=S.filter(s=>!G||s.g===G);let h='';
if(V==='home'){h=`<div class="hero"><h1>Learn it. Quiz it. Own it.</h1><p>Short quizzes and study notes for 5th, 7th and 9th grade. Earn points, spend them on tips and skips, and master every subject.</p><div class="stats"><div class="st"><b>${S.length}</b><small>subjects</small></div><div class="st"><b>${S.reduce((a,s)=>a+s.q.length+(X[s.id]||[]).length,0)}+</b><small>questions, math is endless</small></div><div class="st"><b>${Object.values(P.best).filter(v=>v>=5).length}/${S.length}</b><small>mastered</small></div><div class="st"><b>${P.played}</b><small>rounds played</small></div></div><div class="row" style="margin-top:18px"><button class="btn" onclick="start(S[Math.floor(Math.random()*S.length)].id)">${ic('skip',16)} Surprise me</button>${U?'':`<button class="btn" style="background:rgba(255,255,255,.18);color:#fff" onclick="acct()">Sign in to save progress</button>`}</div></div>${chips}<div class="grid">${list.map(s=>`<div class="card" style="--c:${GC[s.g]}"><span class="em">${ic(IM[s.id],26)}</span><h3>${s.n}</h3><span class="badge">${s.g}th grade · ${PT[s.g]} pts per answer</span><div class="dots">${[0,1,2,3,4].map(i=>`<i class="${i<(P.best[s.id]||0)?'f':''}"></i>`).join('')}</div><span class="mu">Best score ${P.best[s.id]||0} of 5</span><div class="row"><button class="btn" onclick="start('${s.id}')">Start quiz</button><button class="btn alt" onclick="G=${s.g};go('study')">Review notes</button></div></div>`).join('')}</div>`}
if(V==='study'){h=`<h2>Study notes</h2><p class="mu">Read the key ideas, then test yourself.</p>${chips}<div class="grid">${list.map(s=>`<div class="card" style="--c:${GC[s.g]}"><span class="em">${ic(IM[s.id],26)}</span><h3>${s.n}</h3><div class="tut">${esc(s.t)}</div><div class="row"><button class="btn" onclick="start('${s.id}')">Quiz me</button></div></div>`).join('')}</div>`}
if(V==='shop'){h=`<h2>Shop</h2><p class="mu">You have ${P.pts} points.</p>${[['tip','Tips','A tip removes two wrong answers.',[[1,50,'1 tip'],[5,240,'5 tips · save 10'],[10,450,'10 tips · save 50']]],['skip','Skips','A skip passes a question and counts it as a correct answer.',[[1,200,'1 skip'],[5,850,'5 skips · save 150'],[10,1300,'10 skips · save 700']]]].map(([k,t,d,R])=>`<h3 style="margin:22px 0 4px">${t}</h3><p class="mu" style="margin:0 0 12px">${d}</p><div class="grid">${R.map(([n,c,l])=>`<div class="card" style="--c:${k==='tip'?'var(--hl)':'var(--ac)'}"><span class="em">${ic(k==='tip'?'bulb':'skip',26)}</span><h3>${l}</h3><b>${c} points</b><div class="row"><button class="btn" ${P.pts<c?'disabled':''} onclick="buy(${n},${c},'${k}')">Buy</button></div></div>`).join('')}</div>`).join('')}`}
if(V==='quiz'){const q=Q.qs[Q.i],d=Q.sel!==null;h=`<div class="q"><div style="display:flex;justify-content:space-between;gap:8px"><button class="btn alt" onclick="quit()">Exit</button><span class="mu">${Q.s.n} · ${Q.i+1} of ${Q.qs.length}</span></div><div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div><h2 style="margin-bottom:18px">${esc(q.q)}</h2>${q.o.map((t,i)=>`<button class="opt ${Q.gone.includes(i)?'gone':''} ${i===Q.sel?'sel':''}" ${Q.gone.includes(i)?'disabled':''} onclick="pick(${i})"><b>${'ABCD'[i]}</b>${esc(t)}</button>`).join('')}<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn alt" ${Q.gone.length||P.tips<1?'disabled':''} onclick="tip()">${ic('bulb',16)} Use tip (${P.tips})</button><button class="btn alt" ${P.skips<1?'disabled':''} onclick="skip()">${ic('skip',16)} Skip (${P.skips})</button></span><button class="btn" ${d?'':'disabled'} onclick="next()">${Q.i<Q.qs.length-1?'Confirm answer':'Confirm and finish'}</button></div></div>`}
if(V==='result'){const n=Q.qs.length;h=`<div class="q" style="text-align:center"><div class="ring" style="--p:${Q.sc/n*100}"><div>${Q.sc}/${n}</div></div><h2>${Q.sc===n?'Perfect round!':Q.sc>=3?'Nice work!':'Keep practicing'}</h2><p>+${Q.pts} points${Q.bonus?' (includes a +10 perfect bonus)':''}${Q.nb?' · new personal best':''}</p>${Q.miss.length?`<div style="text-align:left"><h3>What you got wrong</h3>${Q.miss.map(m=>`<div class="why"><b>${esc(m.q)}</b><br>You chose: ${esc(m.p)}<br>Correct answer: ${esc(m.o[m.a])}<br>${esc(m.w)}</div>`).join('')}</div>`:''}<div class="row" style="justify-content:center"><button class="btn" onclick="start('${Q.s.id}')">Play again</button><button class="btn alt" onclick="go('home')">All quizzes</button></div></div>`}
$('#app').innerHTML=h;tl()}
const defP=()=>({name:'Player',pts:0,tips:2,best:{},played:0});
function accs(){try{return JSON.parse(localStorage.getItem('qm_acc')||'{}')}catch(e){return{}}}
let U=null,AM='in';
try{U=localStorage.getItem('qm_cur');const a=accs()[U];if(a)P=Object.assign(defP(),a.data);else U=null}catch(e){U=null}
async function hash(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(salt),iterations:150000,hash:'SHA-256'},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function acct(){if(U){const m=Object.values(P.best).filter(v=>v>=5).length;$('#ai').innerHTML=`<div class="av">${esc(P.name[0].toUpperCase())}</div><h2 style="text-align:center">${esc(P.name)}</h2><p class="mu" style="text-align:center;margin:4px 0 0">Signed in. Progress saves on this device.</p><div class="sg"><div><b>${P.pts}</b>Points</div><div><b>${P.played}</b>Rounds played</div><div><b>${P.tips}</b>Tips</div><div><b>${P.skips||0}</b>Skips</div><div><b>${m}/${S.length}</b>Subjects mastered</div><div><b>${Object.keys(P.best).length}</b>Subjects tried</div></div><div class="row"><button class="btn" onclick="logout()">Sign out</button><button class="btn alt" onclick="$('#am').close()">Close</button></div>`;$('#ai').hidden=false;$('#af').hidden=true;$('#am').showModal();tl();return}AM='in';$('#ai').hidden=true;$('#af').hidden=false;amode(1)}
function amode(keep){if(!keep)AM=AM==='in'?'up':'in';const up=AM==='up';$('#at').textContent=up?'Create account':'Sign in';$('#as').textContent=up?'Create account':'Sign in';$('#aq').textContent=up?'Already have an account?':'New here?';$('#ax').textContent=up?'Sign in':'Create account';$('#ad').textContent=up?'Keep your points and tips on this device. Your current progress carries over.':'Welcome back. Pick up where you left off.';$('#ae').textContent='';$('#ap').autocomplete=up?'new-password':'current-password';if(!$('#am').open)$('#am').showModal();tl()}
async function auth(ev){ev.preventDefault();const u=$('#au').value.trim(),pw=$('#ap').value,k=u.toLowerCase(),A=accs(),err=m=>{$('#ae').textContent=m};
try{if(AM==='up'){if(!/^[\w.-]{3,16}$/.test(u))return err('Use 3 to 16 letters, numbers, dots or dashes.');if(A[k])return err('That username is taken.');const s=Array.from(crypto.getRandomValues(new Uint8Array(16)));P.name=u;A[k]={s,h:await hash(pw,s),data:P};localStorage.setItem('qm_acc',JSON.stringify(A));U=k}
else{const a=A[k];if(!a||a.h!==await hash(pw,a.s))return err('Wrong username or password.');U=k;P=Object.assign(defP(),a.data)}
localStorage.setItem('qm_cur',U)}catch(e){U=null;return err('Sign-in needs a secure browser tab with storage enabled.')}
$('#am').close();$('#ap').value='';save();draw();toast('Welcome, '+P.name+'!')}
function logout(){$('#am').close();try{localStorage.removeItem('qm_cur')}catch(e){}U=null;try{P=Object.assign(defP(),JSON.parse(localStorage.getItem('qm2')||'{}'))}catch(e){P=defP()}save();go('home');toast('Signed out')}
const LN={en:'English',pt:'Português',es:'Español',fr:'Français',de:'Deutsch',it:'Italiano',zh:'中文',ja:'日本語'};
let L=null,TC={},busy=false;
try{L=localStorage.getItem('qm_l')}catch(e){}
if(!LN[L]){const b=(navigator.language||'en').slice(0,2);L=LN[b]?b:'en'}
function loadT(){try{TC=JSON.parse(localStorage.getItem('qm_t_'+L)||'{}')}catch(e){TC={}}}
loadT();document.documentElement.lang=L;
$('#lg').innerHTML=Object.entries(LN).map(([k,v])=>`<option value="${k}" ${k===L?'selected':''}>${v}</option>`).join('');
function setL(v){L=v;try{localStorage.setItem('qm_l',v)}catch(e){}document.documentElement.lang=v;loadT();draw()}
function tl(){if(L==='en')return;const ns=[],w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>/\p{L}/u.test(n.nodeValue)&&!n.parentElement.closest('script,style,select,#toast,.logo,#nm')?1:3});while(w.nextNode())ns.push(w.currentNode);ns.forEach(n=>{n._o??=n.nodeValue;const k=n._o.trim();if(TC[k])n.nodeValue=n._o.replace(k,()=>TC[k])});fetchT(ns.map(n=>n._o))}
async function fetchT(list){if(L==='en'||busy)return;const m=[...new Set(list.map(s=>s.trim()))].filter(k=>k.length>2&&/\p{L}/u.test(k)&&!TC[k]);if(!m.length)return;busy=true;const lg=L;toast('Translating…');
try{const sm=await claude.use('sample');if(!sm){toast('Auto-translate needs Claude. Try your browser’s translate feature.');busy=false;return}
for(let i=0;i<m.length;i+=40){const c=m.slice(i,i+40);const r=await sm.json('Translate each string in this JSON array from English to '+LN[lg]+'. Keep numbers, emoji, math symbols and names. Reply with only a JSON array of the same length.\n'+JSON.stringify(c));if(Array.isArray(r)&&r.length===c.length)c.forEach((k,j)=>TC[k]=String(r[j]))}
try{localStorage.setItem('qm_t_'+lg,JSON.stringify(TC))}catch(e){}}catch(e){toast('Translation unavailable right now.')}
busy=false;if(lg===L)tl()}
save();draw();
</script>
</body>
</html>
